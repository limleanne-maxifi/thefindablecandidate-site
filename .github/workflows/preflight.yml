name: preflight

on:
  push:
    branches: [main]
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Same script Netlify runs as its build command. If this is red, the
      # deploy would be red too — find out here, not on the domain.
      - run: node scripts/preflight.mjs
